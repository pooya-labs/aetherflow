[workspace]
resolver = "3"
members = [
    "crates/aetherflow-core",
    "crates/aetherflow-runtime",
    "crates/aetherflow-storage-postgres",
    "crates/aetherflow-transport-nats",
    "crates/aetherflow-wasm",
    "apps/aetherflow-server",
    "examples/minimal-plugin/guest",
    "examples/minimal-plugin/host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/pooya16pg-spec/aetherflow"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
