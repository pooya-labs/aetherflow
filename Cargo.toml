[workspace]
resolver = "3"
members = ["crates/aetherflow-core", "crates/aetherflow-runtime", "crates/aetherflow-storage-postgres", "apps/aetherflow-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/pooya16pg-spec/aetherflow"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
