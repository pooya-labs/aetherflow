[package]
name = "aetherflow-plugin-guest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Minimal AetherFlow ABI v1 WebAssembly plugin guest."
publish = false

[dependencies]
wit-bindgen = "=0.63.0"

[lib]
crate-type = ["cdylib"]

# wit-bindgen generates Component Model ABI export shims that necessarily use
# unsafe FFI declarations/blocks. This generated-code-only package therefore
# does not inherit the workspace's forbid(unsafe_code) lint; its own guest
# implementation contains no hand-written unsafe code.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
