[package]
name = "aetherflow-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Host harness for the minimal AetherFlow ABI v1 plugin example."
publish = false

[dependencies]
aetherflow-core = { version = "0.1.0", path = "../../../crates/aetherflow-core" }
aetherflow-runtime = { version = "0.1.0", path = "../../../crates/aetherflow-runtime" }
aetherflow-wasm = { version = "0.1.0", path = "../../../crates/aetherflow-wasm" }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
wit-component = "=0.254.2"

[lints]
workspace = true
