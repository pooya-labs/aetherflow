openapi: 3.1.0
info:
  title: AetherFlow Control Plane API
  version: 1.0.0
  summary: Versioned control-plane contract for durable workflow execution.
  description: |
    Implemented by the Axum server in apps/aetherflow-server. Without
    DATABASE_URL, only GET /health is available. AETHERFLOW_API_TOKEN is a
    separate high-entropy platform-operator credential; it does not identify
    or select a tenant. Routes under /api/v1/tenant/* require a tenant-bound
    Bearer credential and enforce tenant roles. PostgreSQL enforces tenant
    isolation with ENABLE + FORCE ROW LEVEL SECURITY on all ten tenant-owned
    tables. The HTTP listener defaults to loopback and accepts plaintext only
    on loopback; non-loopback binds require a valid Rustls certificate chain
    and private key. PostgreSQL connections use Rustls and native CA roots,
    with chain and hostname validation required by default. Each HTTP request
    body is limited to 2 MiB; decoded task input is limited to 1 MiB per task.
    Inspection omits payload bytes. Dashboard list endpoints use bounded
    keyset pagination; event-history responses contain only redacted metadata,
    never raw outbox JSON. Browser access is disabled unless
    AETHERFLOW_CORS_ALLOWED_ORIGINS contains an exact HTTP(S) origin. CORS
    preflight is limited to GET/POST and Authorization, Content-Type,
    Traceparent, and Tracestate; wildcard origins and credentialed CORS are
    not supported. Valid W3C trace context is extracted from request headers
    and the server span context is returned in response headers. Baggage is
    not propagated. OTLP export is opt-in and supports HTTP/protobuf only.
servers:
  - url: http://127.0.0.1:8080
    description: Local development only; control-plane routes require Bearer authentication.
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Workflow runs
  - name: Workflow events
  - name: Task runs
  - name: Workers
  - name: Tenant workflow runs
  - name: Tenant task runs
  - name: Observability
paths:
  /api/v1/metrics:
    get:
      tags: [Observability]
      operationId: getPrometheusMetrics
      summary: Export bounded process-level HTTP metrics
      description: |
        Returns aggregate HTTP counters and a bounded latency histogram.
        No paths, query strings, tenant IDs, workflow IDs, task IDs, or other
        high-cardinality labels are exported. The endpoint requires the
        platform operator Bearer credential and is unavailable in health-only mode.
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/tenant/metrics:
    get:
      tags: [Observability]
      security:
        - tenantBearerAuth: []
      operationId: getTenantOperationalMetrics
      summary: Export durable operational gauges for the authenticated tenant
      description: |
        Returns a read-only Prometheus snapshot scoped to the tenant derived
        from the validated Bearer credential. The snapshot includes workflow
        status counts, oldest active workflow age, outbox backlog/ready lag,
        expired outbox claims, inbox pending/processing counts and age, and
        expired inbox/task leases. It does not export tenant, workflow, task,
        event, credential, or payload values as labels or metric samples.
        This is a point-in-time tenant view, not a platform-wide aggregate,
        completion-latency distribution, or production SLO.
      responses:
        '200':
          description: Tenant-scoped Prometheus text exposition format.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      security: []
      tags: [Health]
      operationId: getHealth
      summary: Check process health
      responses:
        '200':
          description: Process is accepting requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/workflow-runs:
    get:
      tags: [Workflow runs]
      security:
        - bearerAuth: []
      operationId: listWorkflowRuns
      summary: List legacy-default workflow runs using keyset pagination
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WorkflowStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque URL-safe cursor returned by the previous page.
          schema:
            type: string
            maxLength: 1024
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: A stable keyset page limited to the reserved legacy-default tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Workflow runs]
      security:
        - bearerAuth: []
      operationId: submitWorkflowRun
      summary: Validate and durably submit a workflow run
      description: |
        The caller supplies a unique workflow_run_id. The workflow definition
        is submitted as a snapshot and is not stored as a reusable definition.
        Reusing an existing workflow_run_id or a conflicting task identity
        returns 409. No idempotent replay behavior is promised in v1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRunSubmission'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Workflow run and its task runs were durably created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/workflow-runs/{workflow_run_id}:
    get:
      tags: [Workflow runs]
      security:
        - bearerAuth: []
      operationId: getWorkflowRun
      summary: Read a durable workflow-run snapshot
      parameters:
        - $ref: '#/components/parameters/WorkflowRunId'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Workflow run and its current task-run snapshots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/workflow-runs/{workflow_run_id}/events:
    get:
      tags: [Workflow events]
      security:
        - bearerAuth: []
      operationId: listWorkflowRunEvents
      summary: Read redacted event history for a legacy-default workflow
      description: Raw outbox JSON is never returned.
      parameters:
        - $ref: '#/components/parameters/WorkflowRunId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque URL-safe cursor returned by the previous page.
          schema:
            type: string
            maxLength: 1024
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Safe event metadata for the workflow and its task runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowEventListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/task-runs/{task_run_id}:
    get:
      tags: [Task runs]
      security:
        - bearerAuth: []
      operationId: getTaskRun
      summary: Read a durable task-run snapshot
      description: |
        Input and output bytes are intentionally omitted. The response reports
        only decoded payload sizes and whether an output exists.
      parameters:
        - $ref: '#/components/parameters/TaskRunId'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Task-run state without payload bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRunSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/task-runs/{task_run_id}/cancel:
    post:
      tags: [Task runs]
      security:
        - bearerAuth: []
      operationId: cancelTaskRun
      summary: Cancel a task run using optimistic concurrency
      description: |
        Cancellation is guarded by expected_version. If another worker or
        operator has already changed the task version or it is terminal, the
        request returns 409. On acceptance the service aggregates the parent
        workflow state before responding.
      parameters:
        - $ref: '#/components/parameters/TaskRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTaskRunRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Task cancellation and parent workflow aggregation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelTaskRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tenant/workflow-runs:
    get:
      tags: [Tenant workflow runs]
      security:
        - tenantBearerAuth: []
      operationId: listTenantWorkflowRuns
      summary: List workflow runs owned by the authenticated tenant
      description: Requires the tenant Read permission. Tenant identity is derived only from the validated credential.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WorkflowStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque URL-safe cursor returned by the previous page.
          schema:
            type: string
            maxLength: 1024
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: A keyset page limited to the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Tenant workflow runs]
      security:
        - tenantBearerAuth: []
      operationId: submitTenantWorkflowRun
      summary: Submit a workflow owned by the authenticated tenant
      description: |
        Tenant ownership is derived from the validated credential, never from
        request fields or headers. Requires the tenant Submit permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRunSubmission'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Tenant-owned workflow and tasks were created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tenant/workflow-runs/{workflow_run_id}:
    get:
      tags: [Tenant workflow runs]
      security:
        - tenantBearerAuth: []
      operationId: getTenantWorkflowRun
      summary: Read a workflow owned by the authenticated tenant
      parameters:
        - $ref: '#/components/parameters/WorkflowRunId'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Workflow and task snapshots belonging to the authenticated tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tenant/workflow-runs/{workflow_run_id}/events:
    get:
      tags: [Tenant workflow runs]
      security:
        - tenantBearerAuth: []
      operationId: listTenantWorkflowRunEvents
      summary: Read redacted event history for a tenant-owned workflow
      description: Requires the tenant Read permission. Raw outbox JSON is never returned.
      parameters:
        - $ref: '#/components/parameters/WorkflowRunId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque URL-safe cursor returned by the previous page.
          schema:
            type: string
            maxLength: 1024
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Safe event metadata for the authenticated workflow and its task runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowEventListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tenant/task-runs/{task_run_id}:
    get:
      tags: [Tenant task runs]
      security:
        - tenantBearerAuth: []
      operationId: getTenantTaskRun
      summary: Read a task owned by the authenticated tenant
      parameters:
        - $ref: '#/components/parameters/TaskRunId'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Task-run state without payload bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRunSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tenant/task-runs/{task_run_id}/cancel:
    post:
      tags: [Tenant task runs]
      security:
        - tenantBearerAuth: []
      operationId: cancelTenantTaskRun
      summary: Cancel a task owned by the authenticated tenant
      description: |
        Requires the tenant Cancel permission and expected_version. The
        parent workflow is aggregated within the same tenant boundary.
      parameters:
        - $ref: '#/components/parameters/TaskRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTaskRunRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Task cancellation and tenant workflow aggregation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelTaskRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/workers:
    get:
      tags: [Workers]
      security:
        - bearerAuth: []
      operationId: listActiveWorkers
      summary: List active worker registrations
      description: |
        Returns live registrations only. Membership and lease timestamps are
        operational metadata; credentials and process environment are never
        exposed.
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Active worker registrations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerListResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: URL-safe platform operator token
    tenantBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: URL-safe tenant credential
  parameters:
    WorkflowRunId:
      name: workflow_run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityId'
    TaskRunId:
      name: task_run_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityId'
  responses:
    Unauthorized:
      description: Missing or invalid operator or tenant Bearer credential.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: The authenticated operator or tenant principal exhausted its per-process token bucket.
      headers:
        Retry-After:
          description: Whole seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The tenant credential is valid but its role does not permit this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid identifier, malformed JSON, unknown status, or invalid workflow definition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Duplicate run identity, stale expected version, or terminal-state race.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Decoded input exceeds the 1 MiB task payload limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested workflow run or task run does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: PostgreSQL is unavailable or the durable operation cannot be completed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error. Internal database details are not returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    EntityId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
      description: Existing AetherFlow bounded ASCII identifier contract.
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    WorkflowRunSubmission:
      type: object
      additionalProperties: false
      required: [workflow_id, workflow_run_id, tasks, retry_policy]
      properties:
        workflow_id:
          $ref: '#/components/schemas/EntityId'
        workflow_run_id:
          $ref: '#/components/schemas/EntityId'
        tasks:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/WorkflowTaskInput'
        retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
    WorkflowTaskInput:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id:
          $ref: '#/components/schemas/EntityId'
        depends_on:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EntityId'
          default: []
        input_base64:
          type: string
          contentEncoding: base64
          description: Optional opaque task input. Decoded length must not exceed 1 MiB.
    RetryPolicy:
      type: object
      additionalProperties: false
      required: [max_attempts, initial_backoff_ms, max_backoff_ms]
      properties:
        max_attempts:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Includes the initial attempt.
        initial_backoff_ms:
          type: integer
          format: int64
          minimum: 0
        max_backoff_ms:
          type: integer
          format: int64
          minimum: 0
          description: Must be greater than or equal to initial_backoff_ms.
    WorkflowRunReceipt:
      type: object
      additionalProperties: false
      required: [workflow_id, workflow_run_id, status, version, task_runs]
      properties:
        workflow_id:
          $ref: '#/components/schemas/EntityId'
        workflow_run_id:
          $ref: '#/components/schemas/EntityId'
        status:
          $ref: '#/components/schemas/WorkflowStatus'
        version:
          type: integer
          format: int64
          minimum: 0
        task_runs:
          type: array
          items:
            $ref: '#/components/schemas/TaskRunReceipt'
    TaskRunReceipt:
      type: object
      additionalProperties: false
      required: [task_id, task_run_id, status]
      properties:
        task_id:
          $ref: '#/components/schemas/EntityId'
        task_run_id:
          $ref: '#/components/schemas/EntityId'
        status:
          $ref: '#/components/schemas/TaskStatus'
    WorkflowRunSnapshot:
      allOf:
        - $ref: '#/components/schemas/WorkflowRunReceipt'
        - type: object
          required: [created_at, updated_at]
          properties:
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    TaskRunSnapshot:
      type: object
      additionalProperties: false
      required:
        [task_run_id, workflow_run_id, task_id, status, version, attempts_started, available_at, input_size_bytes, output_size_bytes, output_present, dependency_task_run_ids, created_at, updated_at]
      properties:
        task_run_id:
          $ref: '#/components/schemas/EntityId'
        workflow_run_id:
          $ref: '#/components/schemas/EntityId'
        task_id:
          $ref: '#/components/schemas/EntityId'
        status:
          $ref: '#/components/schemas/TaskStatus'
        version:
          type: integer
          format: int64
          minimum: 0
        attempts_started:
          type: integer
          minimum: 0
        available_at:
          type: string
          format: date-time
        input_size_bytes:
          type: integer
          minimum: 0
