[package]
name = "aetherflow-storage-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "PostgreSQL connection pooling and durable schema management for AetherFlow."

[dependencies]
aetherflow-core = { version = "0.1.0", path = "../aetherflow-core" }
aetherflow-runtime = { version = "0.1.0", path = "../aetherflow-runtime" }
deadpool-postgres = { version = "=0.14.2", default-features = false, features = ["rt_tokio_1", "runtime", "with-serde_json-1"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
serde_json = "=1.0.154"
tokio-postgres = { version = "=0.7.18", features = ["with-serde_json-1"] }
tokio = { version = "=1.54.1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }

[lints]
workspace = true
