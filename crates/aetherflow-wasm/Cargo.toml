[package]
name = "aetherflow-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Versioned WebAssembly plugin ABI and capability contracts for AetherFlow."

[dependencies]
aetherflow-core = { version = "0.1.0", path = "../aetherflow-core" }
wasmtime = { version = "=48.0.8", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std", "wit-parser"] }

[dev-dependencies]
wit-component = { version = "=0.254.2", features = ["dummy-module"] }
wit-parser = "=0.254.2"
wasmprinter = "=0.254.2"
wat = "=1.263.0"

[lints]
workspace = true
