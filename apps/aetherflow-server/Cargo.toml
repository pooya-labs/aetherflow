[package]
name = "aetherflow-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Loopback-only HTTP control plane for AetherFlow."

[dependencies]
aetherflow-core = { path = "../../crates/aetherflow-core" }
aetherflow-runtime = { path = "../../crates/aetherflow-runtime" }
aetherflow-storage-postgres = { path = "../../crates/aetherflow-storage-postgres" }
axum = "=0.8.9"
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
deadpool-postgres = { version = "=0.14.2", default-features = false, features = ["rt_tokio_1", "runtime"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-postgres = "=0.7.18"

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }

[lints]
workspace = true
