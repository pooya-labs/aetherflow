[package]
name = "aetherflow-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Loopback-default HTTP/HTTPS control plane for AetherFlow."

[dependencies]
aetherflow-core = { version = "0.1.0", path = "../../crates/aetherflow-core" }
aetherflow-runtime = { version = "0.1.0", path = "../../crates/aetherflow-runtime" }
aetherflow-storage-postgres = { version = "0.1.0", path = "../../crates/aetherflow-storage-postgres" }
axum = "=0.8.9"
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
deadpool-postgres = { version = "=0.14.2", default-features = false, features = ["rt_tokio_1", "runtime"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-postgres = "=0.7.18"
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["native-certs", "ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
sha2 = "=0.11.0"
subtle = "=2.6.1"
opentelemetry = { version = "=0.33.1", features = ["trace"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "=0.33.1", features = ["trace"] }
tracing = "=0.1.44"
tracing-opentelemetry = "=0.34.0"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json", "registry"] }

[dev-dependencies]
rcgen = "=0.14.10"
tokio-rustls = "=0.26.6"
tower = { version = "=0.5.3", features = ["util"] }

[lints]
workspace = true
