name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Refresh Cargo.lock when dependencies change on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          manifest_changed=false
          if git show --pretty="" --name-only HEAD | grep -Eq '(^|/)Cargo[.]toml$' || ! cargo +1.99.1 fetch --locked --quiet; then
            manifest_changed=true
          fi

          if [ "$manifest_changed" = true ] || ! cargo +1.99.1 fetch --locked --quiet; then
            cargo +1.99.1 generate-lockfile
            if ! git diff --quiet -- Cargo.lock; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add Cargo.lock
              git commit -m "chore(deps): regenerate Cargo.lock"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

      - name: Verify locked dependency resolution
        run: cargo +1.99.1 fetch --locked

      - name: Apply rustfmt on main pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cargo +1.99.1 fmt --all
          if ! git diff --quiet -- '*.rs'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u -- '*.rs'
            git commit -m "style: apply rustfmt"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Verify formatting
        run: cargo +1.99.1 fmt --all -- --check

      - name: Run Clippy
        run: cargo +1.99.1 clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo +1.99.1 test --workspace --locked

      - name: Build workspace
        run: cargo +1.99.1 build --workspace --release --locked

      - name: Install WebAssembly guest target
        run: rustup +1.99.1 target add wasm32-unknown-unknown

      - name: Build and execute minimal ABI v1 plugin example
        run: |
          cargo +1.99.1 build -p aetherflow-plugin-guest --target wasm32-unknown-unknown --release --locked
          cargo +1.99.1 run -p aetherflow-plugin-host --release --locked -- target/wasm32-unknown-unknown/release/aetherflow_plugin_guest.wasm

      - name: Build documentation
        run: cargo +1.99.1 doc --workspace --no-deps --locked
      - name: Upload resolved Cargo.lock
        uses: actions/upload-artifact@v7
        with:
          name: cargo-lockfile-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
