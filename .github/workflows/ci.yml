name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  compose-smoke:
    name: Validate local Docker Compose stack
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Compose interpolation and model
        run: docker compose --env-file .env.example config --quiet

      - name: Start PostgreSQL and three-node JetStream cluster
        run: docker compose --env-file .env.example up --detach --wait

      - name: Verify restricted database role and NATS cluster routes
        shell: bash
        run: |
          set -euo pipefail
          runtime_guard="$(docker compose --env-file .env.example exec -T postgres \
            psql --username aetherflow_admin --dbname aetherflow_dev \
            --no-align --tuples-only --command "
              SELECT NOT rolsuper
                 AND NOT rolbypassrls
                 AND NOT rolcreaterole
                 AND NOT rolcreatedb
                 AND NOT rolreplication
                 AND NOT has_schema_privilege(oid, 'public', 'CREATE')
                 AND NOT EXISTS (
                   SELECT 1 FROM pg_auth_members WHERE member = oid
                 )
              FROM pg_roles
              WHERE rolname = 'aetherflow_runtime';
            ")"
          test "$runtime_guard" = "t"

          for attempt in $(seq 1 60); do
            ready=true
            for port in 8222 8223 8224; do
              routes="$(curl --silent --show-error --fail \
                "http://127.0.0.1:${port}/routez" | jq -r '.num_routes // 0')"
              if [[ "$routes" -lt 2 ]]; then
                ready=false
              fi
            done
            if [[ "$ready" == "true" ]]; then
              echo "PostgreSQL roles and all three NATS cluster routes are ready."
              exit 0
            fi
            sleep 1
          done
          for service in nats-1 nats-2 nats-3; do
            docker compose --env-file .env.example logs "$service"
          done
          exit 1

      - name: Stop Compose stack and remove temporary volumes
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans

  quality:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Refresh Cargo.lock when dependencies change on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          manifest_changed=false
          if git show --pretty="" --name-only HEAD | grep -Eq '(^|/)Cargo[.]toml$' || ! cargo +1.99.1 fetch --locked --quiet; then
            manifest_changed=true
          fi

          if [ "$manifest_changed" = true ] || ! cargo +1.99.1 fetch --locked --quiet; then
            cargo +1.99.1 generate-lockfile
            if ! git diff --quiet -- Cargo.lock; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add Cargo.lock
              git commit -m "chore(deps): regenerate Cargo.lock"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

      - name: Verify locked dependency resolution
        run: cargo +1.99.1 fetch --locked

      - name: Apply rustfmt on main pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cargo +1.99.1 fmt --all
          if ! git diff --quiet -- '*.rs'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u -- '*.rs'
            git commit -m "style: apply rustfmt"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Verify formatting
        run: cargo +1.99.1 fmt --all -- --check

      - name: Validate product site, dashboard, and gateway JavaScript
        run: |
          node --check site.js
          node --check dashboard/app.js
          node --check cloudflare-gateway/policy.mjs
          node --check cloudflare-gateway/worker.mjs
          node --check cloudflare-gateway/index.mjs
          node --check dashboard/apps-script-bridge.js
          node --check dashboard/runtime-config.js
          node --check cloudflare-free/worker.mjs
          node --check serverless-shared/workflow-core.js
          node --test cloudflare-gateway/policy.test.mjs
          node --test serverless-shared/workflow-core.test.mjs
          node --check < apps-script/Code.gs
          node --check < apps-script/Core.gs
          python3 scripts/check-serverless-contracts.py
      - name: Validate operations runbooks against migrations and RLS
        run: bash scripts/check-operations-docs.sh

      - name: Run Clippy
        run: cargo +1.99.1 clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo +1.99.1 test --workspace --locked

      - name: Build workspace
        run: cargo +1.99.1 build --workspace --release --locked

      - name: Smoke-test reproducible scheduler benchmarks
        run: |
          cargo +1.99.1 bench -p aetherflow-runtime --bench scheduler -- --iterations 2 --warmup 1 --sizes 16,64 --concurrency 1,4 > target/aetherflow-benchmark-smoke.csv
      - name: Upload benchmark smoke results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aetherflow-benchmark-smoke-${{ github.sha }}
          path: target/aetherflow-benchmark-smoke.csv
          if-no-files-found: error
          retention-days: 7

      - name: Install WebAssembly guest target
        run: rustup +1.99.1 target add wasm32-unknown-unknown

      - name: Lint WebAssembly guest target
        run: cargo +1.99.1 clippy -p aetherflow-plugin-guest --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Build and execute minimal ABI v1 plugin example
        run: |
          cargo +1.99.1 build -p aetherflow-plugin-guest --target wasm32-unknown-unknown --release --locked
          cargo +1.99.1 run -p aetherflow-plugin-host --release --locked -- target/wasm32-unknown-unknown/release/aetherflow_plugin_guest.wasm

      - name: Build documentation
        run: cargo +1.99.1 doc --workspace --no-deps --locked
      - name: Upload resolved Cargo.lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cargo-lockfile-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
