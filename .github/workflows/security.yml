name: Supply-chain and secret checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: Audit Rust advisories and dependency sources
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Install pinned cargo-deny
        run: cargo +1.99.1 install cargo-deny --version 0.20.2 --locked

      - name: Check advisories, duplicate versions, wildcards, and source allowlist
        run: cargo +1.99.1 deny --all-features check advisories bans sources

  gitleaks:
    name: Scan full Git history for secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.0"
          cache: false

      - name: Install pinned Gitleaks CLI
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: Scan all reachable Git history
        run: |
          gitleaks git --redact --exit-code 1 --log-opts=--all \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json"

      - name: Upload redacted Gitleaks report for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitleaks-redacted-report-${{ github.sha }}
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 3
