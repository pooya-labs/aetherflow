name: Refresh coordinated WIT dependency lockfile

on:
  push:
    branches:
      - maintenance/wit-toolchain-2026-11
    paths:
      - "crates/aetherflow-wasm/Cargo.toml"
      - "examples/minimal-plugin/guest/Cargo.toml"

permissions:
  contents: write

concurrency:
  group: wit-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dependency branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Generate and resolve the coordinated dependency graph
        run: |
          cargo +1.99.1 generate-lockfile
          cargo +1.99.1 fetch --locked

      - name: Commit refreshed lockfile to this branch
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(deps): refresh coordinated WIT lockfile"
          git fetch --no-tags origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
