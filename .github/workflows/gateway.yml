name: Cloudflare Gateway CI

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-gateway/**"
      - "apps/aetherflow-server/src/api.rs"
      - "apps/aetherflow-server/src/main.rs"
      - ".github/workflows/gateway.yml"
  pull_request:
    paths:
      - "cloudflare-gateway/**"
      - "apps/aetherflow-server/src/api.rs"
      - "apps/aetherflow-server/src/main.rs"
      - ".github/workflows/gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-policy:
    name: Edge proxy and Durable Object policy tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the project's supported Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0

      - name: Record Node runtime
        run: node --version

      - name: Validate JavaScript modules
        run: |
          node --check cloudflare-gateway/policy.mjs
          node --check cloudflare-gateway/worker.mjs
          node --check cloudflare-gateway/index.mjs

      - name: Run gateway policy tests
        run: node --test cloudflare-gateway/policy.test.mjs

      - name: Verify production route remains disabled
        run: |
          grep -Fq 'workersDev: false' cloudflare-gateway/cloudflare.config.ts
          grep -Fq 'previewUrls: false' cloudflare-gateway/cloudflare.config.ts
          grep -Fq 'https://origin-not-configured.invalid' cloudflare-gateway/cloudflare.config.ts
