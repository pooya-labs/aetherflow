name: Cloudflare Gateway CI

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-gateway/**"
      - "apps/aetherflow-server/src/api.rs"
      - "apps/aetherflow-server/src/main.rs"
      - ".github/workflows/gateway.yml"
  pull_request:
    paths:
      - "cloudflare-gateway/**"
      - "apps/aetherflow-server/src/api.rs"
      - "apps/aetherflow-server/src/main.rs"
      - ".github/workflows/gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-policy:
    name: Edge proxy and Durable Object policy tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the project's supported Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.0

      - name: Upgrade npm to the pinned Arborist-compatible release
        run: |
          npm install --global npm@11.19.1
          test "$(npm --version)" = "11.19.1"

      - name: Record Node and npm runtimes
        run: |
          node --version
          npm --version

      # npm ci refuses to proceed when package.json and the committed lockfile
      # disagree, so CI validates the exact dependency graph checked into Git.
      - name: Install committed gateway dependency lock
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: cloudflare-gateway

      - name: Validate JavaScript modules
        run: npm run check
        working-directory: cloudflare-gateway

      - name: Run gateway policy tests
        run: npm test
        working-directory: cloudflare-gateway

      - name: Run Cloudflare Workers runtime and SQLite tests
        run: npm run test:workers-runtime
        working-directory: cloudflare-gateway

      - name: Verify production route remains disabled
        run: |
          grep -Fq 'workersDev: false' cloudflare-gateway/cloudflare.config.ts
          grep -Fq 'previewUrls: false' cloudflare-gateway/cloudflare.config.ts
          grep -Fq 'https://origin-not-configured.invalid' cloudflare-gateway/cloudflare.config.ts
          grep -Fq '"workers_dev": false' cloudflare-gateway/wrangler.test.jsonc
          grep -Fq '"preview_urls": false' cloudflare-gateway/wrangler.test.jsonc
