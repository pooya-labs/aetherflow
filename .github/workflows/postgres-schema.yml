name: PostgreSQL schema validation

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/aetherflow-storage-postgres/**"
      - "crates/aetherflow-transport-nats/**"
      - "crates/aetherflow-runtime/migrations/postgres/**"
      - "apps/aetherflow-server/**"
      - ".github/workflows/postgres-schema.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/aetherflow-storage-postgres/**"
      - "crates/aetherflow-transport-nats/**"
      - "crates/aetherflow-runtime/migrations/postgres/**"
      - "apps/aetherflow-server/**"
      - ".github/workflows/postgres-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-schema:
    name: Apply and verify PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: aetherflow_test
          POSTGRES_USER: aetherflow
          POSTGRES_PASSWORD: aetherflow-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aetherflow -d aetherflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: aetherflow
      PGPASSWORD: aetherflow-ci-password
      PGDATABASE: aetherflow_test
      AETHERFLOW_TEST_DATABASE_URL: postgres://aetherflow:aetherflow-ci-password@127.0.0.1:5432/aetherflow_test
      AETHERFLOW_MIGRATION_TEST_DATABASE_URL: postgres://aetherflow:aetherflow-ci-password@127.0.0.1:5432/aetherflow_migration_test
      AETHERFLOW_TEST_NATS_DATABASE_URL: postgres://aetherflow:aetherflow-ci-password@127.0.0.1:5432/aetherflow_nats_test
      AETHERFLOW_TEST_NATS_URL: nats://127.0.0.1:4222,nats://127.0.0.1:4223,nats://127.0.0.1:4224
      AETHERFLOW_TEST_NATS_CONTAINER: aetherflow-nats-1
      AETHERFLOW_TEST_PACKET_PARTITION: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Refresh lockfile for local validation
        run: cargo +1.99.1 generate-lockfile

      - name: Fetch locked dependencies
        run: cargo +1.99.1 fetch --locked

      - name: Install PostgreSQL client and verify packet-filter prerequisites
        run: |
          packages=()
          if ! command -v psql >/dev/null 2>&1; then
            packages+=(postgresql-client)
          fi
          if ! command -v iptables >/dev/null 2>&1; then
            packages+=(iptables)
          fi
          if [[ ${#packages[@]} -gt 0 ]]; then
            sudo apt-get update
            sudo apt-get install --yes "${packages[@]}"
          fi
          psql --version
          iptables --version
          sudo -n iptables -S OUTPUT >/dev/null
          test "$(sudo -n -u nobody -- id -u)" = "$(id -u nobody)"

      - name: Create isolated database for migration bootstrap concurrency test
        run: createdb --host 127.0.0.1 --username aetherflow aetherflow_migration_test

      - name: Run PostgreSQL storage integration tests
        run: cargo +1.99.1 test -p aetherflow-storage-postgres --tests --locked

      - name: Run PostgreSQL-backed HTTP API integration tests
        run: cargo +1.99.1 test -p aetherflow-server --locked -- --test-threads=1

      - name: Start three-node NATS JetStream cluster
        run: |
          docker network create aetherflow-nats-cluster
          for node in 1 2 3; do
            docker volume create "aetherflow-nats-${node}-data"
          done

          docker run --detach --name aetherflow-nats-1 --network aetherflow-nats-cluster \
            --publish 4222:4222 --publish 8222:8222 \
            --volume aetherflow-nats-1-data:/data nats:2.12-alpine \
            -js -sd /data -m 8222 -name aetherflow-nats-1 -client_advertise 127.0.0.1:4222 -cluster nats://0.0.0.0:6222 \
            -routes nats://aetherflow-nats-2:6222,nats://aetherflow-nats-3:6222 \
            -cluster_name aetherflow
          docker run --detach --name aetherflow-nats-2 --network aetherflow-nats-cluster \
            --publish 4223:4222 --publish 8223:8222 \
            --volume aetherflow-nats-2-data:/data nats:2.12-alpine \
            -js -sd /data -m 8222 -name aetherflow-nats-2 -client_advertise 127.0.0.1:4223 -cluster nats://0.0.0.0:6222 \
            -routes nats://aetherflow-nats-1:6222,nats://aetherflow-nats-3:6222 \
            -cluster_name aetherflow
          docker run --detach --name aetherflow-nats-3 --network aetherflow-nats-cluster \
            --publish 4224:4222 --publish 8224:8222 \
            --volume aetherflow-nats-3-data:/data nats:2.12-alpine \
            -js -sd /data -m 8222 -name aetherflow-nats-3 -client_advertise 127.0.0.1:4224 -cluster nats://0.0.0.0:6222 \
            -routes nats://aetherflow-nats-1:6222,nats://aetherflow-nats-2:6222 \
            -cluster_name aetherflow

          for attempt in $(seq 1 60); do
            ready=true
            for port in 8222 8223 8224; do
              routes="$(curl --silent --show-error --fail "http://127.0.0.1:${port}/routez" | jq -r '.num_routes // 0' 2>/dev/null || echo 0)"
              if [[ "${routes}" -lt 2 ]]; then
                ready=false
              fi
            done
            if [[ "${ready}" == "true" ]]; then
              echo "All three NATS servers have two cluster routes."
              sleep 3
              exit 0
            fi
            sleep 1
          done
          for node in 1 2 3; do
            docker logs "aetherflow-nats-${node}"
          done
          exit 1

      - name: Verify migration ledger, tables, and indexes
        run: |
          migration_count="$(psql --no-align --tuples-only --command "
            SELECT count(*)
            FROM aetherflow_schema_migrations
            WHERE (version = 1 AND migration_name = '0001_initial_schema.sql'
                   AND checksum_sha256 ~ '^[0-9a-f]{64}$')
               OR (version = 2 AND migration_name = '0002_consumer_inbox.sql'
                   AND checksum_sha256 ~ '^[0-9a-f]{64}$')
               OR (version = 3 AND migration_name = '0003_node_membership.sql'
                   AND checksum_sha256 ~ '^[0-9a-f]{64}$')
               OR (version = 4 AND migration_name = '0004_tenant_ownership.sql'
                   AND checksum_sha256 ~ '^[0-9a-f]{64}$');
          ")"
          test "$migration_count" = "4"

          table_count="$(psql --no-align --tuples-only --command "
            SELECT count(*) FROM information_schema.tables
            WHERE table_schema = 'public'
              AND table_name IN (
                'aetherflow_schema_migrations', 'workflow_runs', 'task_runs',
                'task_run_dependencies', 'task_attempts', 'outbox_events',
                'consumer_inbox', 'cluster_nodes', 'worker_registrations',
                'tenants', 'tenant_principals', 'tenant_credentials', 'worker_tenant_grants'
              );
          ")"
          test "$table_count" = "13"

          index_count="$(psql --no-align --tuples-only --command "
            SELECT count(*) FROM pg_indexes
            WHERE schemaname = 'public'
              AND indexname IN (
                'workflow_runs_idempotency_key_uq',
                'task_runs_ready_claim_idx',
                'task_runs_expired_lease_idx',
                'task_run_dependencies_parent_idx',
                'task_attempts_one_running_uq',
                'task_attempts_history_idx',
                'outbox_events_pending_idx',
                'outbox_events_expired_claim_idx',
                'consumer_inbox_expired_lease_idx',
                'consumer_inbox_processed_retention_idx',
                'cluster_nodes_expired_lease_idx',
                'worker_registrations_node_epoch_idx',
                'worker_registrations_expired_lease_idx',
                'tenant_principals_tenant_status_idx',
                'tenant_credentials_token_sha256_uq',
                'tenant_credentials_principal_status_idx',
                'workflow_runs_tenant_status_created_idx',
                'task_runs_tenant_ready_claim_idx',
                'task_runs_tenant_expired_lease_idx',
                'task_run_dependencies_tenant_parent_idx',
                'task_attempts_tenant_history_idx',
                'outbox_events_tenant_pending_idx',
                'outbox_events_tenant_expired_claim_idx',
                'consumer_inbox_tenant_expired_lease_idx',
                'consumer_inbox_tenant_processed_retention_idx',
                'worker_tenant_grants_worker_status_idx'
              );
          ")"
          test "$index_count" = "26"

      - name: Create isolated database and test real JetStream transport
        run: |
          createdb --host 127.0.0.1 --username aetherflow aetherflow_nats_test
          cargo +1.99.1 test -p aetherflow-transport-nats --test jetstream_outbox --locked -- --test-threads=1

      - name: Verify schema records and reject invalid invariants
        run: |
          psql --set ON_ERROR_STOP=1 <<'SQL'
          BEGIN;

          INSERT INTO workflow_runs (
            workflow_run_id, workflow_id, status, idempotency_key
          ) VALUES (
            'wf-ci-001', 'wf-definition-001', 'running', 'request-001'
          );

          INSERT INTO task_runs (
            task_run_id, workflow_run_id, task_id, status,
            attempts_started, max_attempts, started_at, claimed_by, lease_expires_at
          ) VALUES
            ('task-run-parent', 'wf-ci-001', 'task-parent', 'running',
             1, 3, clock_timestamp(), 'worker-ci-001', clock_timestamp() + INTERVAL '1 minute'),
            ('task-run-child', 'wf-ci-001', 'task-child', 'pending',
             0, 3, NULL, NULL, NULL);

          INSERT INTO task_run_dependencies (
            workflow_run_id, child_task_run_id, parent_task_run_id, dependency_position
          ) VALUES ('wf-ci-001', 'task-run-child', 'task-run-parent', 0);

          UPDATE task_runs
          SET status = 'succeeded', output_payload = decode('', 'hex'),
              claimed_by = NULL, lease_expires_at = NULL,
              finished_at = clock_timestamp(), version = version + 1
          WHERE task_run_id = 'task-run-parent';

          INSERT INTO task_attempts (
            attempt_id, task_run_id, attempt_number, worker_id,
            fencing_token, outcome, finished_at
          ) VALUES (
            'attempt-ci-001', 'task-run-parent', 1, 'worker-ci-001',
            1, 'succeeded', clock_timestamp()
          );

          INSERT INTO outbox_events (
            aggregate_type, aggregate_id, aggregate_version, event_type, payload
          ) VALUES (
            'task_run', 'task-run-parent', 1, 'task.succeeded',
            '{"task_id":"task-parent"}'::jsonb
          );

          INSERT INTO consumer_inbox (
            consumer_name, event_id, status, attempts, claim_owner,
            claim_token, lease_expires_at
          ) VALUES (
            'ci-consumer', 'event-ci-001', 'processing', 1, 'worker-ci-001',
            1, clock_timestamp() + INTERVAL '1 minute'
          );

          UPDATE consumer_inbox
          SET status = 'processed', claim_owner = NULL, lease_expires_at = NULL,
              processed_at = clock_timestamp()
          WHERE consumer_name = 'ci-consumer' AND event_id = 'event-ci-001';

          INSERT INTO cluster_nodes (
            node_id, incarnation_id, membership_epoch, status, lease_expires_at
          ) VALUES (
            'node-ci-001', 'incarnation-ci-001', 1, 'active',
            clock_timestamp() + INTERVAL '1 minute'
          );

          INSERT INTO worker_registrations (
            worker_id, node_id, membership_epoch, status, concurrency_limit,
            lease_expires_at
          ) VALUES (
            'worker-ci-membership-001', 'node-ci-001', 1, 'active', 4,
            clock_timestamp() + INTERVAL '30 seconds'
          );

          DO $
          BEGIN
            IF (SELECT tenant_id FROM workflow_runs WHERE workflow_run_id = 'wf-ci-001') <> 'legacy-default' THEN
              RAISE EXCEPTION 'legacy workflow was not assigned to the reserved tenant';
            END IF;

            IF (SELECT tenant_id FROM consumer_inbox WHERE consumer_name = 'ci-consumer' AND event_id = 'event-ci-001') <> 'legacy-default' THEN
              RAISE EXCEPTION 'legacy inbox event was not assigned to the reserved tenant';
            END IF;

            BEGIN
              INSERT INTO task_runs (
                task_run_id, workflow_run_id, task_id, status
              ) VALUES (
                'task-run-invalid-lease', 'wf-ci-001', 'task-invalid-lease', 'running'
              );
              RAISE EXCEPTION 'running task without an owner and lease was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;

            BEGIN
              INSERT INTO task_runs (
                task_run_id, workflow_run_id, task_id, status, input_payload
              ) VALUES (
                'task-run-too-large', 'wf-ci-001', 'task-too-large', 'pending',
                decode(repeat('00', 1048577), 'hex')
              );
              RAISE EXCEPTION 'oversized task input was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;

            BEGIN
              INSERT INTO task_run_dependencies (
                workflow_run_id, child_task_run_id, parent_task_run_id, dependency_position
              ) VALUES ('wf-ci-001', 'task-run-child', 'task-run-parent', 1);
              RAISE EXCEPTION 'duplicate dependency edge was accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;

            BEGIN
              INSERT INTO consumer_inbox (
                consumer_name, event_id, status, attempts, claim_token
              ) VALUES ('ci-consumer', 'event-invalid-state', 'processed', 1, 1);
              RAISE EXCEPTION 'processed inbox row without processed_at was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;

            BEGIN
              INSERT INTO cluster_nodes (
                node_id, incarnation_id, membership_epoch, status, lease_expires_at
              ) VALUES (
                'node-invalid-epoch', 'incarnation-invalid-epoch', 0, 'active',
                clock_timestamp() + INTERVAL '1 minute'
              );
              RAISE EXCEPTION 'zero membership epoch was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;

            BEGIN
              INSERT INTO worker_registrations (
                worker_id, node_id, membership_epoch, status, concurrency_limit,
                lease_expires_at
              ) VALUES (
                'worker-invalid-capacity', 'node-ci-001', 1, 'active', 0,
                clock_timestamp() + INTERVAL '1 minute'
              );
              RAISE EXCEPTION 'zero worker concurrency was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END
          $$;

          ROLLBACK;
          SQL
)
               OR (version = 4 AND migration_name = '0004_tenant_ownership.sql'
                   AND checksum_sha256 ~ '^[0-9a-f]{64}

          table_count="$(psql --no-align --tuples-only --command "
            SELECT count(*) FROM information_schema.tables
            WHERE table_schema = 'public'
              AND table_name IN (
                'aetherflow_schema_migrations', 'workflow_runs', 'task_runs',
                'task_run_dependencies', 'task_attempts', 'outbox_events',
                'consumer_inbox', 'cluster_nodes', 'worker_registrations'
              );
          ")"
          test "$table_count" = "9"

          index_count="$(psql --no-align --tuples-only --command "
            SELECT count(*) FROM pg_indexes
            WHERE schemaname = 'public'
              AND indexname IN (
                'workflow_runs_idempotency_key_uq',
                'task_runs_ready_claim_idx',
                'task_runs_expired_lease_idx',
                'task_run_dependencies_parent_idx',
                'task_attempts_one_running_uq',
                'task_attempts_history_idx',
                'outbox_events_pending_idx',
                'outbox_events_expired_claim_idx',
                'consumer_inbox_expired_lease_idx',
                'consumer_inbox_processed_retention_idx',
                'cluster_nodes_expired_lease_idx',
                'worker_registrations_node_epoch_idx',
                'worker_registrations_expired_lease_idx'
              );
          ")"
          test "$index_count" = "13"

