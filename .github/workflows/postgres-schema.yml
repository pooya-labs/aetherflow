              ) VALUES ('wf-ci-001', 'task-run-child', 'task-run-parent', 1);
              RAISE EXCEPTION 'duplicate dependency edge was accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;

            BEGIN
