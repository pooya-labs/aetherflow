name: PostgreSQL schema validation

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/aetherflow-storage-postgres/**"
      - "crates/aetherflow-runtime/migrations/postgres/**"
      - ".github/workflows/postgres-schema.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/aetherflow-storage-postgres/**"
      - "crates/aetherflow-runtime/migrations/postgres/**"
      - ".github/workflows/postgres-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-schema:
    name: Apply and verify PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: aetherflow_test
          POSTGRES_USER: aetherflow
          POSTGRES_PASSWORD: aetherflow-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aetherflow -d aetherflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: aetherflow
      PGPASSWORD: aetherflow-ci-password
      PGDATABASE: aetherflow_test
      AETHERFLOW_TEST_DATABASE_URL: postgres://aetherflow:aetherflow-ci-password@127.0.0.1:5432/aetherflow_test
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Refresh lockfile for local validation
        run: cargo +1.99.1 generate-lockfile

      - name: Fetch locked dependencies
        run: cargo +1.99.1 fetch --locked

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version

      - name: Run async migration runner against PostgreSQL 18
        run: cargo +1.99.1 test -p aetherflow-storage-postgres --tests --locked

      - name: Verify migration ledger, required tables, and indexes
        run: |
          migration_count="$(psql --no-align --tuples-only --command "
            SELECT count(*)
            FROM aetherflow_schema_migrations
            WHERE version = 1
              AND migration_name = '0001_initial_schema.sql'
              AND checksum_sha256 ~ '^[0-9a-f]{64}$';
          ")"
          test "$migration_count" = "1"

          table_count="$(psql --no-align --tuples-only --command "
            SELECT count(*)
            FROM information_schema.tables
            WHERE table_schema = 'public'
              AND table_name IN (
                'aetherflow_schema_migrations',
                'workflow_runs',
                'task_runs',
                'task_run_dependencies',
                'task_attempts',
                'outbox_events'
              );
          ")"
          test "$table_count" = "6"

          index_count="$(psql --no-align --tuples-only --command "
            SELECT count(*)
            FROM pg_indexes
            WHERE schemaname = 'public'
              AND indexname IN (
                'workflow_runs_idempotency_key_uq',
                'task_runs_ready_claim_idx',
                'task_runs_expired_lease_idx',
                'task_run_dependencies_parent_idx',
                'task_attempts_one_running_uq',
                'task_attempts_history_idx',
                'outbox_events_pending_idx',
                'outbox_events_expired_claim_idx'
              );
          ")"
          test "$index_count" = "8"

      - name: Verify schema records and reject invalid invariants
        run: |
          psql --set ON_ERROR_STOP=1 <<'SQL'
          BEGIN;

          INSERT INTO workflow_runs (
            workflow_run_id, workflow_id, status, idempotency_key
          ) VALUES (
            'wf-ci-001', 'wf-definition-001', 'running', 'request-001'
          );

          INSERT INTO task_runs (
            task_run_id, workflow_run_id, task_id, status,
            attempts_started, max_attempts, started_at, claimed_by, lease_expires_at
          ) VALUES
            ('task-run-parent', 'wf-ci-001', 'task-parent', 'running',
             1, 3, clock_timestamp(), 'worker-ci-001', clock_timestamp() + INTERVAL '1 minute'),
            ('task-run-child', 'wf-ci-001', 'task-child', 'pending',
             0, 3, NULL, NULL, NULL);

          INSERT INTO task_run_dependencies (
            workflow_run_id, child_task_run_id, parent_task_run_id, dependency_position
          ) VALUES (
            'wf-ci-001', 'task-run-child', 'task-run-parent', 0
          );

          UPDATE task_runs
          SET status = 'succeeded',
              output_payload = decode('', 'hex'),
              claimed_by = NULL,
              lease_expires_at = NULL,
              finished_at = clock_timestamp(),
              version = version + 1
          WHERE task_run_id = 'task-run-parent';

          INSERT INTO task_attempts (
            attempt_id, task_run_id, attempt_number, worker_id,
            fencing_token, outcome, finished_at
          ) VALUES (
            'attempt-ci-001', 'task-run-parent', 1, 'worker-ci-001',
            1, 'succeeded', clock_timestamp()
          );

          INSERT INTO outbox_events (
            aggregate_type, aggregate_id, aggregate_version,
            event_type, payload
          ) VALUES (
            'task_run', 'task-run-parent', 1, 'task.succeeded',
            '{"task_id":"task-parent"}'::jsonb
          );

          DO $$
          BEGIN
            BEGIN
              INSERT INTO task_runs (
                task_run_id, workflow_run_id, task_id, status
              ) VALUES (
                'task-run-invalid-lease', 'wf-ci-001', 'task-invalid-lease', 'running'
              );
              RAISE EXCEPTION 'running task without an owner and lease was accepted';
            EXCEPTION WHEN check_violation THEN
              NULL;
            END;

            BEGIN
              INSERT INTO task_runs (
                task_run_id, workflow_run_id, task_id, status, input_payload
              ) VALUES (
                'task-run-too-large', 'wf-ci-001', 'task-too-large', 'pending',
                decode(repeat('00', 1048577), 'hex')
              );
              RAISE EXCEPTION 'oversized task input was accepted';
            EXCEPTION WHEN check_violation THEN
              NULL;
            END;

            BEGIN
              INSERT INTO task_run_dependencies (
                workflow_run_id, child_task_run_id, parent_task_run_id, dependency_position
              ) VALUES (
                'wf-ci-001', 'task-run-child', 'task-run-parent', 1
              );
              RAISE EXCEPTION 'duplicate dependency edge was accepted';
            EXCEPTION WHEN unique_violation THEN
              NULL;
            END;
          END
          $$;

          ROLLBACK;
          SQL
