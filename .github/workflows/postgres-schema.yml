            claim_token, lease_expires_at
          ) VALUES (
            'ci-consumer', 'event-ci-001', 'processing', 1, 'worker-ci-001',
            1, clock_timestamp() + INTERVAL '1 minute'
          );

          UPDATE consumer_inbox
          SET status = 'processed', claim_owner = NULL, lease_expires_at = NULL,
